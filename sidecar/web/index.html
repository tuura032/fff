<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waiver Board</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div class="brand">
    <h1>Waiver Board</h1>
    <span id="season" class="muted"></span>
  </div>
  <nav id="views">
    <button data-view="waivers" class="active">Waivers</button>
    <button data-view="rankings">Rankings</button>
    <button data-view="kd">K &amp; D/ST</button>
    <button data-view="team">My Team</button>
    <button data-view="lookback">Look back</button>
  </nav>
  <div id="status-bar" class="chips"></div>
  <button id="refresh" class="btn">Refresh all</button>
</header>
<main>
  <section id="view-waivers" class="view"></section>
  <section id="view-rankings" class="view hidden"></section>
  <section id="view-kd" class="view hidden"></section>
  <section id="view-team" class="view hidden"></section>
  <section id="view-lookback" class="view hidden"></section>
</main>
<div id="toast" class="hidden"></div>
<script src="app.js"></script>
</body>
</html>
