name: update-standings

on:
  schedule:
    # Crons below are ET (see timezone:). Game nights: ESPN finalizes scores
    # shortly after the final whistle, so the site picks up the new week
    # within ~an hour of games ending. The extra runs are free -- the commit
    # gate only fires when the rendered site actually changes, and a skipped
    # or delayed run is covered by the next one.
    - cron: '0 8 * * *'       # daily: stat corrections + safety net
    - cron: '0 13-23 * * 0'   # Sunday: last games end 8:20pm
    - cron: '0 18-23 * * 1,4' # Monday/Thursday: the night game
    - cron: '0 0 * * 1,4'     # midnight: the night game's final
  workflow_dispatch:          # manual "run now" (Actions UI; not linked from the site)

permissions:
  contents: write

timezone: America/New_York

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Q3: the scoring math is the only real logic in the repo, and the
      # bot commits its output straight to production. Fail before fetching
      # rather than publishing standings computed by broken code.
      - name: Run tests
        run: python -m unittest test_compute -v

      - name: Fetch, compute, build
        # LEAGUE_PHRASE is a repository secret. build.py hashes it and bakes
        # only the SHA-256 into the pages, so the phrase itself is never
        # committed. If the secret is unset the gate is simply omitted.
        env:
          LEAGUE_PHRASE: ${{ secrets.LEAGUE_PHRASE }}
        run: |
          python fetch.py
          # Started lineups for the Kickers page. Separate call because it
          # is one request per week rather than three per season; it only
          # asks for weeks it does not already have and stops at the first
          # one that has not been played, so this is a request or two in
          # season and none at all outside it.
          python fetch.py --starters
          python compute.py
          python build.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          # Gate on docs/ (the rendered site), not data/: raw-*.json carries
          # live in-game scores on game weeks, which churn every run while
          # the site stays byte-identical. When docs/ does change, data/
          # ships with it as a consistent snapshot.
          if git diff --cached --quiet -- docs/; then
            echo "Site unchanged - skipping commit."
          else
            git commit -m "Update standings (auto)"
            git push
          fi
